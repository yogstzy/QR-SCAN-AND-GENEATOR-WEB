<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        QR Code Generator

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

    <link
        rel="stylesheet"
        href="css/generator.css">

</head>

<body>

<div class="container py-5">

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <div

    class="d-flex

    justify-content-between

    align-items-center

    mb-4">

    <a

        href="index.html"

        class="btn btn-outline-success">

        <i class="bi bi-arrow-left"></i>

        Kembali ke Scanner

    </a>

    <button

        id="themeToggle"

        class="theme-toggle"

        title="Dark Mode">

        <i

            id="themeIcon"

            class="bi bi-moon-stars-fill">

        </i>

    </button>

</div>

    <div class="generator-header">

        <div class="generator-logo">

            <i class="bi bi-qr-code-scan"></i>

        </div>

        <h2>

            QR Code Generator

        </h2>

        <p>

            Buat berbagai jenis QR Code secara mudah dan gratis langsung dari browser.

        </p>

    </div>

    <!-- ========================= -->
    <!-- QR TYPE -->
    <!-- ========================= -->

    <div class="card shadow-sm border-0 rounded-4 mt-4">

        <div class="card-body">

            <h5 class="mb-4">

                Pilih Jenis QR Code

            </h5>

            <div class="qr-type-grid">

    <button class="qr-type active" data-type="website">

        <i class="bi bi-globe2"></i>

        <span>Website</span>

    </button>

    <button class="qr-type" data-type="wifi">

        <i class="bi bi-wifi"></i>

        <span>Wi-Fi</span>

    </button>

    <button class="qr-type" data-type="text">

        <i class="bi bi-file-text"></i>

        <span>Text</span>

    </button>

    <button class="qr-type" data-type="email">

        <i class="bi bi-envelope"></i>

        <span>Email</span>

    </button>

    <button class="qr-type" data-type="phone">

        <i class="bi bi-telephone"></i>

        <span>Phone</span>

    </button>

    <button class="qr-type" data-type="sms">

        <i class="bi bi-chat-dots"></i>

        <span>SMS</span>

    </button>

    <button class="qr-type" data-type="location">

        <i class="bi bi-geo-alt"></i>

        <span>Location</span>

    </button>

    <button class="qr-type" data-type="contact">

        <i class="bi bi-person-vcard"></i>

        <span>Contact</span>

    </button>

    <button class="qr-type" data-type="whatsapp">

        <i class="bi bi-whatsapp"></i>

        <span>WhatsApp</span>

    </button>

</div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- FORM -->
    <!-- ========================= -->

    <div
        class="card shadow-sm border-0 rounded-4 mt-4">

        <div class="card-body">

            <h5>

                Data QR

            </h5>

            <!-- Form dinamis -->

            <div id="dynamicForm">

            </div>

        </div>

    </div>

<!-- ========================= -->
<!-- QR STYLE -->
<!-- ========================= -->

<div class="card shadow-sm border-0 rounded-4 mt-4">

    <div class="card-body">

        <h5>

            <i class="bi bi-palette-fill"></i>

            QR Style

        </h5>

        <div class="row mt-4">

            <!-- Foreground -->

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Foreground

                </label>

                <input

                    type="color"

                    id="foregroundColor"

                    class="form-control form-control-color"

                    value="#000000">

            </div>

            <!-- Background -->

            <div class="col-md-6 mb-3">

                <label class="form-label">

                    Background

                </label>

                <input

                    type="color"

                    id="backgroundColor"

                    class="form-control form-control-color"

                    value="#ffffff">

            </div>

        </div>

        <!-- Preset -->

        <label class="form-label mt-2">

            Preset Warna

        </label>

        <div class="preset-grid">

            <button

                class="preset-btn"

                data-dark="#000000"

                data-light="#ffffff">

                🟢 Classic

            </button>

            <button

                class="preset-btn"

                data-dark="#111827"

                data-light="#ffffff">

                ⚫ Dark

            </button>

            <button

                class="preset-btn"

                data-dark="#2563eb"

                data-light="#ffffff">

                🔵 Ocean

            </button>

            <button

                class="preset-btn"

                data-dark="#7c3aed"

                data-light="#ffffff">

                🟣 Purple

            </button>

            <button

                class="preset-btn"

                data-dark="#dc2626"

                data-light="#ffffff">

                🔴 Red

            </button>

        </div>

        <button

            id="resetColorBtn"

            class="btn btn-outline-secondary mt-4 w-100">

            <i class="bi bi-arrow-counterclockwise"></i>

            Reset Warna

        </button>

    </div>

</div>

    <!-- ========================= -->
    <!-- PREVIEW -->
    <!-- ========================= -->

    <div
        class="card shadow-sm border-0 rounded-4 mt-4">

        <div class="card-body text-center">

            <h5>

                Preview QR Code

            </h5>

            <div id="qrPreview">

    <div class="preview-placeholder">

        <i class="bi bi-qr-code"></i>

        <p class="mt-3 mb-0">

            QR Code akan muncul di sini

        </p>

    </div>

</div>

            <div class="mt-4 d-grid gap-2">

    <button
        class="btn btn-success"
        id="generateBtn">

        <i class="bi bi-magic"></i>

        Generate QR Code

    </button>

    <div class="dropdown">

        <button
            class="btn btn-primary dropdown-toggle w-100"
            type="button"
            id="downloadDropdownBtn"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            disabled>

            <i class="bi bi-download"></i>

            Download PNG

        </button>

        <ul class="dropdown-menu w-100" aria-labelledby="downloadDropdownBtn">

            <li>
                <a class="dropdown-item" href="#" id="downloadPngOption">
                    <i class="bi bi-filetype-png"></i>
                    PNG
                </a>
            </li>

            <li>
                <a class="dropdown-item" href="#" id="downloadSvgOption">
                    <i class="bi bi-filetype-svg"></i>
                    SVG
                </a>
            </li>

        </ul>

    </div>

</div>

        </div>

    </div>


<div class="text-center mt-5 text-secondary small">

    QR Scanner Pro • QR Code Generator  • By Yoga

</div>

<!-- ===================================== -->
<!-- TOAST -->
<!-- ===================================== -->

<div class="toast-container position-fixed top-0 end-0 p-3">

    <div

        id="appToast"

        class="toast align-items-center border-0"

        role="alert"

        aria-live="assertive"

        aria-atomic="true"

    >

        <div class="d-flex">

            <div

                id="toastMessage"

                class="toast-body">

            </div>

            <button

                class="btn-close btn-close-white me-2 m-auto"

                data-bs-dismiss="toast">

            </button>

        </div>

    </div>

</div>

<!-- QRCode.js -->

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<!-- JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/generator.js"></script>
<script src="js/theme.js"></script>

</body>

</html>
